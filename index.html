<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>UPLOX — Ultra-Fast Secure File Uploads</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
</head>
<body class="min-h-screen bg-[#0a0a0c] text-gray-200 flex flex-col justify-between antialiased">
  <header class="w-full border-b border-[#22222a] bg-[#0a0a0c]/80 backdrop-blur-md px-6 py-4 sticky top-0 z-40">
    <div class="max-w-7xl mx-auto flex items-center justify-between">
      <div class="flex items-center space-x-3 cursor-pointer" onclick="switchRoute('upload')">
        <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-blue-600 to-cyan-500 flex items-center justify-center font-bold text-white shadow-lg">
          <i class="fa-solid fa-cloud-arrow-up text-lg"></i>
        </div>
        <span class="text-xl font-bold text-white">UPLOX</span>
      </div>
      <div class="flex items-center space-x-3">
        <button id="nav-user-btn" onclick="switchRoute('upload')" class="px-3 py-1.5 rounded-md text-xs font-medium bg-blue-600 text-white">Upload Mode</button>
        <button id="nav-admin-btn" onclick="switchRoute('admin')" class="px-3 py-1.5 rounded-md text-xs font-medium text-gray-400 hover:text-white">Admin Panel</button>
      </div>
    </div>
  </header>

  <main class="flex-grow flex items-center justify-center p-4">
    <!-- Username Screen -->
    <section id="username-screen" class="w-full max-w-md bg-[#121216] border border-[#22222a] rounded-2xl p-6 shadow-2xl">
      <h2 class="text-2xl font-bold text-white text-center mb-2">Welcome to UPLOX</h2>
      <p class="text-sm text-gray-400 text-center mb-6">Enter your username to begin uploading files.</p>
      <form id="username-form" class="space-y-4">
        <input type="text" id="input-username" required placeholder="e.g. alex_dev" class="w-full bg-[#16161d] border border-[#22222a] rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-blue-500" />
        <button type="submit" class="w-full py-3 bg-blue-600 hover:bg-blue-500 text-white font-medium rounded-xl transition-all">Continue</button>
      </form>
    </section>

    <!-- Upload Screen -->
    <section id="upload-screen" class="hidden w-full max-w-2xl bg-[#121216] border border-[#22222a] rounded-2xl p-6 shadow-2xl">
      <div class="flex justify-between items-center mb-6 pb-4 border-b border-[#22222a]">
        <h2 class="text-xl font-bold text-white">Upload Files</h2>
        <span id="active-username" class="text-sm font-semibold text-blue-400">@user</span>
      </div>
      <div id="drop-zone" class="border-2 border-dashed border-[#22222a] rounded-xl p-8 text-center cursor-pointer bg-[#16161d]/50">
        <input type="file" id="fileInput" class="hidden" multiple />
        <i class="fa-solid fa-cloud-arrow-up text-3xl text-blue-500 mb-2"></i>
        <p class="text-sm text-white font-medium">Click or drag & drop files here</p>
      </div>
      <div id="upload-progress-box" class="mt-4 hidden">
        <div class="flex justify-between text-xs text-gray-300 mb-1">
          <span id="progress-status-text">Uploading...</span>
          <span id="progress-percent">0%</span>
        </div>
        <div class="w-full h-2 bg-[#16161d] rounded-full overflow-hidden">
          <div id="progress-bar-fill" class="h-full bg-blue-600 w-0 transition-all"></div>
        </div>
      </div>
      <button id="btn-complete-upload" disabled onclick="performUpload()" class="mt-6 w-full py-3 bg-blue-600 hover:bg-blue-500 disabled:opacity-50 text-white font-medium rounded-xl transition-all">COMPLETE UPLOAD</button>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
